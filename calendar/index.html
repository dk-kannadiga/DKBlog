<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3d1f0a">
  <meta name="description" content="ದರ್ಶನ (ಡೀಕೆ) ರಚಿಸಿದ ಒಂದೇ ಪುಟದ ೧೦,೦೦೦ ವರ್ಷಗಳ ಗ್ರೆಗೋರಿಯನ್ ಕ್ಯಾಲೆಂಡರ್.">
  <link rel="canonical" href="https://dkblog-6c5e5.web.app/calendar/">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/themes.css?v=menu-contrast-2">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Kannada:wght@400;500;700&family=Noto+Sans+Kannada:wght@400;500;700&display=swap">
  <script src="/js/themes.js"></script>
  <script src="/js/calendar-chart.js" defer></script>
  <title>೧೦,೦೦೦ ವರ್ಷಗಳ ಕ್ಯಾಲೆಂಡರ್ · ಡೀಕೆಯ ಬರಹಗಳು</title>
  <style>
    .calendar-page { max-width: 1200px; margin: auto; padding: 24px 16px 48px; font-family: var(--theme-font, 'Anek Kannada'), sans-serif; }
    .calendar-page .stitle, .calendar-page .back { font-family: inherit; }
    .calendar-actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 14px 0; }
    .calendar-actions a { text-decoration: underline; color: var(--ac); }
    .calendar-chart-scroll { overflow: auto; border: 1px solid var(--gl); margin-top: 12px; }
    .calendar-chart { position: relative; min-width: 960px; background: var(--cb); }
    .calendar-chart :is(img,canvas) { display: block; width: 100%; height: auto; }
    .calendar-chart [hidden] { display: none; }
    .calendar-chart canvas { cursor: crosshair; }
    .calendar-highlight { position: absolute; pointer-events: none; background: var(--ac); opacity: .24; }
    .calendar-highlight-cell { background: transparent; outline: 2px solid var(--ac); opacity: 1; }
  </style>
</head>
<body>
  <main class="calendar-page">
    <a class="back" href="/about">← ಡೀಕೆಯ ಬಗ್ಗೆ</a>
    <h1 class="stitle">೧೦,೦೦೦ ವರ್ಷಗಳ ಕ್ಯಾಲೆಂಡರ್</h1>
    <p>ದರ್ಶನ (ಡೀಕೆ) ರಚಿಸಿದ ಒಂದೇ ಪುಟದ ಗ್ರೆಗೋರಿಯನ್ ಕ್ಯಾಲೆಂಡರ್.</p>
    <div class="calendar-actions">
      <a href="/assets/10000-year-calendar.pdf" target="_blank" rel="noopener">PDF ತೆರೆಯಿರಿ</a>
      <a href="/assets/10000-year-calendar.pdf" download>PDF ಡೌನ್‌ಲೋಡ್ ಮಾಡಿ</a>
    </div>
    <p id="calendar-hint">ಕೋಶವನ್ನು ಒತ್ತಿದಾಗ ಅದರ ಸಾಲು ಮತ್ತು ಅಂಕಣ ಎದ್ದು ಕಾಣುತ್ತವೆ. ಮೊಬೈಲ್‌ನಲ್ಲಿ ಪಟ್ಟಿಯನ್ನು ಬದಿಗೆ ಸರಿಸಬಹುದು.</p>
    <div class="calendar-chart-scroll">
      <div class="calendar-chart">
        <img id="calendar-source" src="/assets/10000-year-calendar.png" width="2420" height="1870" alt="ಮೂಲ ೧೦,೦೦೦ ವರ್ಷಗಳ ಕ್ಯಾಲೆಂಡರ್ ಪಟ್ಟಿ">
        <canvas id="calendar-chart" width="2420" height="1870" tabindex="0" aria-label="೧೦,೦೦೦ ವರ್ಷಗಳ ಕ್ಯಾಲೆಂಡರ್ ಪಟ್ಟಿ" aria-describedby="calendar-hint" hidden></canvas>
        <div id="calendar-highlight-row" class="calendar-highlight" hidden></div>
        <div id="calendar-highlight-column" class="calendar-highlight" hidden></div>
        <div id="calendar-highlight-cell" class="calendar-highlight calendar-highlight-cell" hidden></div>
      </div>
    </div>
  </main>
</body>
</html>
